name: Update Premier League Elo

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: premier-league-elo-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -u premier_league_elo.py
      - name: Publish updated tables
        env:
          OUTPUT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current_elo_rankings.csv daily_projections.csv weekly_projections.csv future_projections.csv historical_predictions.csv performance_games.csv pl_elo_history.csv elo_parameters.csv run_metadata.json data/premier_league_matches.csv data/snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Premier League Elo tables"
            git push origin "HEAD:$OUTPUT_BRANCH"
          fi
